<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriLife - Rekomendasi Makanan</title>
    <script>
        // Terapkan tema secara instan sebelum halaman dirender untuk mencegah "flash"
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
    </script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="custom-logo"><div class="logo-leaf"></div></div>
            <h2 class="logo-text">Nutri<span>Life</span></h2>
        </div>
        <div class="nav-right">
            <button class="search-btn" title="Cari Menu" onclick="window.location.href='search.html'">🔍</button>
            <div class="theme-control-nav">
                <input type="checkbox" id="theme-toggle" hidden />
                <label for="theme-toggle" class="theme-btn-nav"><span class="theme-icon">☀️</span></label>
            </div>
        </div>
    </nav>

    <div id="app" class="app-wrapper hidden fade-init">
        <main class="makanan-main-content">
            <!-- Rekomendasi Pemenuhan Nutrisi -->
            <section class="recommendations-section">
                <h2 class="section-title">Analisis <span>Riwayat Penyakit</span></h2>
                <p class="loading-msg" style="margin-top: -15px; margin-bottom: 20px; text-align: left;">Temukan menu makanan atau bahan pangan yang direkomendasikan untuk menunjang pemulihan kesehatan Anda.</p>

                <div class="health-search-card" style="margin-bottom: 25px;">
                    <div class="health-search-box">
                        <input type="text" id="health-query" placeholder="Cari penyakit (misal: Jantung, Diabetes)...">
                        <button id="search-health-btn">CARI</button>
                    </div>
                </div>

                <!-- Horizontal Filter Chips -->
                <div class="filter-container">
                    <div class="filter-chips">
                        <button class="chip active">Rekomendasi Makanan</button>
                        <button class="chip">Karbohidrat</button>
                        <button class="chip">Lemak</button>
                        <button class="chip">Mineral</button>
                        <button class="chip">Protein</button>
                        <button class="chip">Air</button>
                        <button class="chip">Vitamin</button>
                    </div>
                </div>

                <!-- Wadah untuk daftar rekomendasi yang akan diisi oleh JavaScript -->
                <div class="recommendations-list"></div>
            </section>
        </main>
    </div>
    
    <nav class="bottom-nav">
        <div class="nav-item" data-target="home">
            <span class="icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" data-target="nutrition">
            <span class="icon">🍴</span>
            <span>Nutrisi</span>
        </div>
        <div class="nav-item active" data-target="food">
            <span class="icon">🥗</span>
            <span>Makanan</span>
        </div>
    </nav>
    <script type="module" src="script.js"></script>
</body>
</html>
